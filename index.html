<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autentificare</title>
<style>
body{
 margin:0;
 font-family:Arial, sans-serif;
 background:#f5f6f7;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
}

.box{
 background:white;
 padding:20px;
 border-radius:10px;
 width:90%;
 max-width:350px;
 box-shadow:0 0 10px rgba(0,0,0,0.1);
 text-align:center;
}

input{
 width:100%;
 padding:12px;
 margin:10px 0;
 border-radius:6px;
 border:1px solid #ccc;
 font-size:16px;
}

button{
 width:100%;
 padding:12px;
 background:#2f6cf6;
 color:white;
 border:none;
 border-radius:6px;
 font-size:18px;
}

#error{
 color:red;
 margin-top:10px;
}
</style>
</head>
<body>

<div class="box">
<h2>Bine ai revenit</h2>

<input id="user" type="text" placeholder="Utilizator sau e-mail">
<input id="pass" type="password" placeholder="Parolă">

<button onclick="login()">Autentificare</button>

<div id="error"></div>
</div>

<script>
function login(){
 let u = document.getElementById("user").value;
 let p = document.getElementById("pass").value;

 if(u === "5051212152514" && p === "12122005"){
   window.location.href = "cont.html";
 } else {
   document.getElementById("error").innerText = "Date incorecte!";
 }
}
</script>

</body>
</html>
